<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%">
  <!-- Defs / Gradients / Glows -->
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B16" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.01)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes flowLine {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barCompress {
      0% { width: 140px; fill: #EF4444; }
      100% { width: 90px; fill: #10B981; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.5); opacity: 1; }
    }
    @keyframes stageScan {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .flow-line {
      stroke-dasharray: 40;
      stroke-dashoffset: 0;
      animation: flowLine 20s infinite linear;
    }
    .pulse-dot {
      animation: pulseDot 2s infinite ease-in-out;
    }
    .animated-bar {
      animation: barCompress 3s infinite alternate ease-in-out;
    }
    .stage-item {
      animation: stageScan 3s infinite ease-in-out;
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="350" fill="url(#bgGrad)" rx="16" stroke="#1E293B" stroke-width="2"/>
  <rect width="1000" height="350" fill="url(#cardGrid)" rx="16" pointer-events="none"/>

  <!-- Main Pipeline Flow Line (underlay) -->
  <path d="M 260,165 C 380,80 620,80 740,165" fill="none" stroke="url(#flowGrad)" stroke-width="4" stroke-linecap="round" class="flow-line"/>

  <!-- Left Card: Input State -->
  <g transform="translate(40, 50)">
    <!-- Container -->
    <rect width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2" opacity="0.9"/>

    <!-- Title -->
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8" letter-spacing="1" textLength="180" lengthAdjust="spacingAndGlyphs">UNCOMPRESSED PROMPT</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#EF4444" textLength="150" lengthAdjust="spacingAndGlyphs">1,420 Tokens</text>
    <text x="20" y="85" font-family="monospace" font-size="11" fill="#64748B" textLength="150" lengthAdjust="spacingAndGlyphs">Latency: 1.84s (est)</text>

    <!-- Visual Representation of Large Stack -->
    <rect x="20" y="115" width="180" height="100" rx="6" fill="#0D111C" stroke="#334155"/>
    <g fill="#EF4444" opacity="0.7">
      <rect x="30" y="125" width="160" height="10" rx="2" />
      <rect x="30" y="140" width="160" height="10" rx="2" />
      <rect x="30" y="155" width="160" height="10" rx="2" />
      <rect x="30" y="170" width="160" height="10" rx="2" />
      <rect x="30" y="185" width="120" height="10" rx="2" />
    </g>
    <!-- Indicator Dot -->
    <circle cx="200" cy="30" r="5" fill="#EF4444" class="pulse-dot"/>
  </g>

  <!-- Middle: 6-Stage Compression Process -->
  <g transform="translate(300, 50)">
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7000FF" letter-spacing="1.5" text-anchor="middle" textLength="200" lengthAdjust="spacingAndGlyphs">TOKEN REDUCTION PIPELINE</text>

    <!-- Compression Box -->
    <rect width="240" height="240" rx="12" fill="#0D111C" stroke="#38BDF8" stroke-width="1.5" y="45" opacity="0.9"/>

    <!-- Stages list inside -->
    <g font-family="monospace" font-size="11" font-weight="bold" fill="#E2E8F0" transform="translate(20, 60)">
      <g class="stage-item" style="animation-delay: 0.1s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="0"/>
        <text x="10" y="15" textLength="180" lengthAdjust="spacingAndGlyphs">1. TSC (Schema Strip)</text>
      </g>
      <g class="stage-item" style="animation-delay: 0.2s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="27"/>
        <text x="10" y="42" textLength="180" lengthAdjust="spacingAndGlyphs">2. DCP (Turn Dedupe)</text>
      </g>
      <g class="stage-item" style="animation-delay: 0.3s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="54"/>
        <text x="10" y="69" textLength="180" lengthAdjust="spacingAndGlyphs">3. RTK (Tool Truncate)</text>
      </g>
      <g class="stage-item" style="animation-delay: 0.4s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="81"/>
        <text x="10" y="96" textLength="180" lengthAdjust="spacingAndGlyphs">4. Caveman (Diff Comp)</text>
      </g>
      <g class="stage-item" style="animation-delay: 0.5s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="108"/>
        <text x="10" y="123" textLength="180" lengthAdjust="spacingAndGlyphs">5. ImageDedupe</text>
      </g>
      <g class="stage-item" style="animation-delay: 0.6s;">
        <rect width="200" height="22" rx="4" fill="#1E293B" y="135"/>
        <text x="10" y="150" textLength="180" lengthAdjust="spacingAndGlyphs">6. CacheMarkers</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Output State -->
  <g transform="translate(740, 50)">
    <!-- Container -->
    <rect width="220" height="240" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" opacity="0.9"/>

    <!-- Title -->
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8" letter-spacing="1" textLength="180" lengthAdjust="spacingAndGlyphs">COMPRESSED PROMPT</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#10B981" textLength="150" lengthAdjust="spacingAndGlyphs">924 Tokens</text>
    <!-- Saving tag -->
    <rect x="20" y="80" width="80" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="60" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#10B981" text-anchor="middle" textLength="70" lengthAdjust="spacingAndGlyphs">-35% Saved</text>

    <!-- Visual Representation of Small Stack -->
    <rect x="20" y="115" width="180" height="100" rx="6" fill="#0D111C" stroke="#334155"/>
    <g fill="#10B981" opacity="0.7">
      <rect x="30" y="125" width="120" height="10" rx="2" class="animated-bar"/>
      <rect x="30" y="140" width="120" height="10" rx="2" class="animated-bar"/>
      <rect x="30" y="155" width="120" height="10" rx="2" class="animated-bar"/>
      <rect x="30" y="170" width="70" height="10" rx="2" />
    </g>
    <!-- Indicator Dot -->
    <circle cx="200" cy="30" r="5" fill="#10B981" class="pulse-dot"/>
  </g>

  <!-- Connector nodes styling -->
  <circle cx="260" cy="165" r="6" fill="#EF4444"/>
  <circle cx="740" cy="165" r="6" fill="#10B981"/>
</svg>
